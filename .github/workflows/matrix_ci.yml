name: Matrix Testing CI
# this is similar to the pyart CI action
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This job installs dependencies and runs tests across a matrix of python and OS versions.
#Add if: github.repository == 'tobac-project/tobac' to limit runs to tobac repo

jobs:
  cache-pixi-lock:
    if: github.repository == 'tobac-project/tobac'
    uses: ./.github/workflows/pixi-lock.yml

  build:
    name: ${{ matrix.os }}-${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}-latest
    needs: cache-pixi-lock
    if: github.repository == 'tobac-project/tobac'
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [macos, ubuntu, windows]
        # map each python version to its pixi environment (see pixi.toml)
        include:
          - python-version: "3.9"
            pixi-env: py39
          - python-version: "3.10"
            pixi-env: py310
          - python-version: "3.11"
            pixi-env: py311
          - python-version: "3.12"
            pixi-env: py312
          - python-version: "3.13"
            pixi-env: py313
          - python-version: "3.14"
            pixi-env: py314

    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi environment
        uses: ./.github/actions/setup-pixi-env
        with:
          cache-key: ${{ needs.cache-pixi-lock.outputs.cache-key }}
          pixi-version: ${{ needs.cache-pixi-lock.outputs.pixi-version }}
          environments: ${{ matrix.pixi-env }}

      - name: Run Tests
        id: run_tests
        run: |
          pixi run -e ${{ matrix.pixi-env }} test
