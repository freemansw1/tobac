name: Check Python File Formatting with Black
on: [push, pull_request]
jobs:
  # solve pixi.lock once per day; shared by every job (see pixi-lock.yml)
  cache-pixi-lock:
    uses: ./.github/workflows/pixi-lock.yml

  formatting_job:
    runs-on: ubuntu-latest
    needs: cache-pixi-lock
    steps:
      - uses: actions/checkout@v4
      - name: Set up pixi environment
        uses: ./.github/actions/setup-pixi-env
        with:
          cache-key: ${{ needs.cache-pixi-lock.outputs.cache-key }}
          pixi-version: ${{ needs.cache-pixi-lock.outputs.pixi-version }}
      - name: Check formatting
        run:
          pixi run black --version &&
          pixi run lint-black
