name: Jupyter Notebooks CI
on: [push, pull_request]
jobs:
  cache-pixi-lock:
    uses: ./.github/workflows/pixi-lock.yml

  Check-Notebooks:
    runs-on: ubuntu-latest
    needs: cache-pixi-lock
    env:
      CI: true
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: check out repository code
        uses: actions/checkout@v4
      - name: Set up pixi environment
        uses: ./.github/actions/setup-pixi-env
        with:
          cache-key: ${{ needs.cache-pixi-lock.outputs.cache-key }}
          pixi-version: ${{ needs.cache-pixi-lock.outputs.pixi-version }}
          environments: examples
          activate-environment: examples
      - name: Find all notebook files
        run: |
          find . -type f -name '*.ipynb' -not -path './.pixi/*' > nbfiles.txt
          cat nbfiles.txt
      - name: Execute all notebook files
        run: |
          while IFS= read -r nbpath; do
            jupyter nbconvert --inplace --ClearMetadataPreprocessor.enabled=True --clear-output $nbpath
            jupyter nbconvert --to notebook --inplace --execute $nbpath
          done < nbfiles.txt
