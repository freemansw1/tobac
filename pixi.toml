# pixi workspace used by CI (and available for local development).
# Run e.g. `pixi run -e py313 test`, `pixi run lint-black`, `pixi run -e examples jupyter lab`.
# pixi.lock is intentionally not committed: CI re-solves it daily (see the
# cache-pixi-lock job in .github/workflows) so tests run against current releases.
[workspace]
name = "tobac"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.9,<3.15"
numpy = "*"
scipy = "*"
scikit-image = "*"
scikit-learn = "*"
pandas = "*"
matplotlib = "*"
iris = "*"
xarray = "*"
cartopy = "*"
trackpy = "*"
typing_extensions = "*"
pip = "*"

[pypi-dependencies]
tobac = { path = ".", editable = true }

[feature.test.dependencies]
pytest = "*"
coverage = "*"
pytest-cov = "*"

[feature.test.tasks]
test = "pytest -v"
coverage = "python -m coverage run -m pytest --cov=./ --cov-report=xml"

[feature.lint.dependencies]
black = "*"
pylint = "*"

[feature.lint.tasks]
lint-black = "black tobac --check --diff"
lint-pylint = "pylint tobac --disable=C --exit-zero"

[feature.examples]
platforms = ["linux-64"]

[feature.examples.dependencies]
xarray = "<2024.10.0"
trackpy = ">=0.6.1"
jupyter = "*"
notebook = "*"
nbconvert = "*"
pytables = "*"
s3fs = "*"
arm_pyart = "*"
seaborn = "*"
h5netcdf = "*"
rioxarray = "*"
numba = "*"
dask = "*"
ffmpeg = "*"
intake = "==0.7.0"
intake-xarray = "==0.7.0"
healpix = "*"
easygems = "==0.1.2"
"pyvista" = ">=0.46"
trame = "*"
trame-vtk = "*"
trame-vuetify = "*"
ipywidgets = "*"
vtk = ">=9.4.2"

[feature.py39.dependencies]
python = "3.9.*"
[feature.py310.dependencies]
python = "3.10.*"
[feature.py311.dependencies]
python = "3.11.*"
[feature.py312.dependencies]
python = "3.12.*"
[feature.py313.dependencies]
python = "3.13.*"
[feature.py314.dependencies]
python = "3.14.*"

[environments]
default = ["test", "lint"]
py39 = ["test", "py39"]
py310 = ["test", "py310"]
py311 = ["test", "py311"]
py312 = ["test", "py312"]
py313 = ["test", "py313"]
py314 = ["test", "py314"]
examples = ["examples"]
